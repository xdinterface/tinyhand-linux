[package]
name = "tinyhand"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A tiny hand on a stick that points at things on your screen"

[dependencies]
tinyhand-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
