name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - run: apt-get update && apt-get install -y build-essential pkg-config curl ca-certificates libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev libasound2-dev
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          make build
          packaging/deb/build.sh
      - run: apt-get install -y ./target/deb/tinyhand-amd64.deb && tinyhand --version && tinyhand list | head -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/deb/tinyhand-amd64.deb

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - run: dnf install -y rpm-build cargo gcc make gtk4-devel libadwaita-devel gtk4-layer-shell-devel alsa-lib-devel
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          rpmbuild -bb --build-in-place --define "tinyhand_version $version" --define "_rpmdir $PWD/target/rpm" packaging/rpm/tinyhand.spec
          cp target/rpm/x86_64/tinyhand-*.rpm target/rpm/tinyhand-x86_64.rpm
      - run: dnf install -y target/rpm/tinyhand-x86_64.rpm && tinyhand --version && tinyhand list | head -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: target/rpm/tinyhand-x86_64.rpm

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes tinyhand-amd64.deb tinyhand-x86_64.rpm
        env:
          GH_TOKEN: ${{ github.token }}
